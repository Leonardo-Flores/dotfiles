# Fuzzel — Catppuccin Mocha. Mirrors the colors used in ~/.config/wofi/style.css
# so menus look the same regardless of which launcher invokes them.

font=JetBrainsMono Nerd Font:size=12
prompt="  "
horizontal-pad=20
vertical-pad=12
inner-pad=8
line-height=22
width=30
lines=10
tabs=4
layer=overlay

[colors]
background=1e1e2eeb
text=cdd6f4ff
match=cba6f7ff
selection=cba6f726
selection-text=cba6f7ff
selection-match=89b4faff
border=cba6f766
prompt=cba6f7ff
input=cdd6f4ff
placeholder=6c7086ff
counter=6c7086ff

[border]
width=2
radius=14

[dmenu]
exit-immediately-if-empty=no
